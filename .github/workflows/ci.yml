# Fast checks on every push and pull request.
#
# The repo holds two Go modules — the library at the root and the REST API in
# api/ — so each gets its own job. There are no test files yet; `go test` still
# compiles every package and fails on a broken build.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: go vet ./...
      - run: go test ./...
