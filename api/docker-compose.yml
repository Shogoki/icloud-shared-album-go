# Local development only.
#
# Production runs on Dokploy, which pulls the image built by
# .github/workflows/deploy.yml and supplies the domain and CORS origins from
# its own environment — deliberately not from this file, which is public.
#
# Copy .env.example to .env to point CORS at your own frontend.

services:
  icloud-api-go:
    build:
      context: .
    image: icloud-api-go:dev
    container_name: icloud-api-go
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:80"
    environment:
      PORT: 80
      # Comma-separated. Defaults to http://localhost:1313 inside the app when
      # unset — see allowedOrigins() in main.go.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
